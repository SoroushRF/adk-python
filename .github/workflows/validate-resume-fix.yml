name: Validate reviewed resume fix

on:
  push:
    branches: [validation/resume-idless-oct3]

permissions:
  contents: read

jobs:
  full-tox-matrix:
    name: Full tox suite (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            tox: py310
          - python: '3.11'
            tox: py311
          - python: '3.12'
            tox: py312
          - python: '3.13'
            tox: py313
          - python: '3.14'
            tox: py314
    steps:
      - name: Check out validation inputs
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: validation-inputs
          persist-credentials: false
      - name: Check out exact reviewed commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: SoroushRF/adk-python
          ref: d3fc9d13d39137351be2b25763239c8c5d560389
          path: source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: false
      - name: Verify commit and pin the tested dependency lock
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = d3fc9d13d39137351be2b25763239c8c5d560389
          cp ../validation-inputs/validation/resume-uv.lock uv.lock
          uv tool install tox --with tox-uv
      - name: Run the complete isolated tox suite
        working-directory: source
        run: |
          set -o pipefail
          tox --workdir "$RUNNER_TEMP/adk-resume-tox" -e '${{ matrix.tox }}' \
            --override 'testenv.commands=pytest tests/unittests -n 2 --junitxml=test-results.xml' \
            2>&1 | tee "$RUNNER_TEMP/resume-tox.log"
      - name: Record verifiable test summary
        if: always()
        env:
          TEST_PYTHON: ${{ matrix.python }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          log = Path(os.environ['RUNNER_TEMP']) / 'resume-tox.log'
          text = log.read_text(errors='replace') if log.exists() else ''
          lines = [line for line in text.splitlines() if re.search(r'\d+ passed', line)]
          report = Path('source/test-results.xml')
          result = 'Test report was not produced; inspect the failed setup/test step.'
          if report.exists():
              suite = ET.parse(report).getroot().find('testsuite')
              result = str(suite.attrib)
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as output:
              output.write('# Exact-commit ADK resume validation\n\n')
              output.write('Commit: `d3fc9d13d39137351be2b25763239c8c5d560389`\n\n')
              output.write('Python: ' + os.environ['TEST_PYTHON'] + '\n\n')
              output.write((lines[-1] if lines else result) + '\n\n')
              output.write('JUnit result: ' + result + '\n')
          PY
